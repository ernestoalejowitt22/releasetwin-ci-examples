name: Express demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # upload to the public example org with the job's own identity — no secret
    steps:
      - name: Checkout releasetwin-ci-examples
        uses: actions/checkout@v7

      - name: Checkout ReleaseTwin (for examples/cases-express)
        uses: actions/checkout@v7
        with:
          repository: ernestoalejowitt22/ReleaseTwin
          path: releasetwin-engine

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install express-demo
        working-directory: apps/express-demo
        run: npm ci

      - name: Boot express-demo
        working-directory: apps/express-demo
        run: |
          npm start &
          npx wait-on http://localhost:4599/orders/42

      - name: Run the release-proof cases (fails the job on any case failure or adverse flag-proof verdict)
        env:
          API_BASE_URL: http://localhost:4599
          # Feeds the live demo at https://releasetwin.com/demo (the public example
          # organization). On a fork PR, or wherever the secret is not set, the token is
          # empty and the CLI skips the upload entirely — the run itself is unaffected.
          RELEASETWIN_API_URL: https://api.releasetwin.com
          # Preferred: the project id (a repository *variable*, not a secret) + the OIDC permission
          # above. The CLI exchanges the job's GitHub token for a short-lived credential; the project
          # must be bound to this repository on its Settings page. Fallback: a stored token secret.
          RELEASETWIN_PROJECT_ID: ${{ vars.RELEASETWIN_PROJECT_ID_EXPRESS || vars.RELEASETWIN_PROJECT_ID }}
          RELEASETWIN_API_TOKEN: ${{ secrets.RELEASETWIN_API_TOKEN_EXPRESS || secrets.RELEASETWIN_API_TOKEN }}
        run: |
          mkdir -p test-results
          # Mount the whole examples/ dir, not just cases-express/ — fixtures
          # resolve from a sibling `fixtures/` directory next to the cases
          # root, so cases-express alone would leave that unresolvable.
          docker run --rm --network host \
            -v "${{ github.workspace }}/releasetwin-engine/examples:/examples:ro" \
            -v "${{ github.workspace }}/test-results:/test-results" \
            -e API_BASE_URL -e RELEASETWIN_API_URL -e RELEASETWIN_API_TOKEN -e RELEASETWIN_PROJECT_ID \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/ernestoalejowitt22/releasetwin/cli:0.4.0 \
            run /examples/cases-express --junit-xml /test-results/junit.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: express-demo-junit
          path: test-results/junit.xml
          if-no-files-found: ignore
