name: Mirror to Bitbucket

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails the job (visibly, in GitHub Actions) rather than silently
      # leaving Bitbucket stale — per design.md's risk mitigation.
      - name: Push-mirror main to Bitbucket
        run: |
          git push --force "https://${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}@bitbucket.org/releasetwin/releasetwin-ci-examples.git" HEAD:main
        env:
          BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BITBUCKET_APP_PASSWORD: ${{ secrets.BITBUCKET_APP_PASSWORD }}
