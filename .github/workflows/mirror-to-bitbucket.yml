name: Mirror to Bitbucket

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails the job (visibly, in GitHub Actions) rather than silently
      # leaving Bitbucket stale — per design.md's risk mitigation.
      #
      # BITBUCKET_REPO_TOKEN is a repository access token (Bitbucket's
      # current replacement for the deprecated app-password flow); over
      # git+https it authenticates as username "x-token-auth" with the token
      # as the password.
      - name: Push-mirror main to Bitbucket
        run: |
          git push --force "https://x-token-auth:${BITBUCKET_REPO_TOKEN}@bitbucket.org/releasetwin/releasetwin-ci-example-projects.git" HEAD:main
        env:
          BITBUCKET_REPO_TOKEN: ${{ secrets.BITBUCKET_REPO_TOKEN }}
